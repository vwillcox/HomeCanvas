<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0c10">
<title data-t="web.notes.notes">Notes</title>
<style>
  /* The kiosk's glass look, as on the dashboard editor. */
  :root {
    --bg: #0b0c10; --glass: rgba(255,255,255,.055); --line: rgba(255,255,255,.10);
    --text: #fff; --muted: rgba(255,255,255,.62); --accent: #a6c8ff; --danger: #ff8a8a;
    --ui: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; color: var(--text); font: 16px/1.45 var(--ui);
    background: radial-gradient(900px 600px at 8% -12%, rgba(166,200,255,.16), transparent 70%), var(--bg);
    -webkit-font-smoothing: antialiased;
  }
  main { max-width: 560px; margin: 0 auto; padding: 28px 16px 48px; display: grid; gap: 18px; }
  h1 { margin: 0; font-size: 30px; letter-spacing: -.02em; }
  .sub { margin: 2px 0 0; color: var(--muted); }
  form { display: grid; gap: 10px; padding: 16px; border-radius: 24px; background: var(--glass); border: 1px solid var(--line); }
  textarea, input {
    width: 100%; font: inherit; color: var(--text); background: rgba(0,0,0,.28);
    border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px;
  }
  textarea { min-height: 110px; resize: vertical; font-size: 18px; }
  textarea:focus, input:focus, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .row { display: flex; gap: 10px; align-items: center; }
  .row input { flex: 1; }
  button {
    font: inherit; font-weight: 650; border: none; border-radius: 999px; padding: 12px 22px;
    background: #fff; color: #0b0c10; cursor: pointer; min-height: 46px;
  }
  button:disabled { opacity: .5; }
  .count { color: var(--muted); font-size: 13px; text-align: right; }
  #status { min-height: 1.4em; color: var(--muted); font-size: 14px; }
  #status.error { color: var(--danger); }
  ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
  li {
    display: flex; gap: 12px; align-items: flex-start; padding: 14px 14px 12px 16px;
    border-radius: 16px; color: #2a2419; box-shadow: 0 6px 16px rgba(0,0,0,.35);
  }
  li .text { flex: 1; min-width: 0; white-space: pre-wrap; overflow-wrap: anywhere; font-weight: 650; }
  li small { display: block; margin-top: 4px; color: rgba(42,36,25,.66); font-weight: 400; }
  li button { background: rgba(42,36,25,.12); color: #2a2419; padding: 8px 14px; min-height: 36px; font-size: 14px; }
  .empty { color: var(--muted); text-align: center; padding: 18px; }
  h2 { margin: 8px 0 0; font-size: 18px; }
</style>
</head>
<body>
<main>
  <header>
    <h1 data-t="web.notes.notes">Notes</h1>
    <p data-t="web.notes.stickANoteOnThe" class="sub">Stick a note on the panel.</p>
  </header>

  <form id="form">
    <textarea id="text" maxlength="280" placeholder="Dentist moved to Thursday 4pm" data-t-placeholder="web.notes.examplePlaceholder" required></textarea>
    <div class="count"><span id="left">280</span> left</div>
    <div class="row">
      <input id="from" maxlength="40" placeholder="From (your name)" data-t-placeholder="web.notes.fromPlaceholder" autocomplete="name">
      <button data-t="web.notes.post" id="post" type="submit">Post</button>
    </div>
    <div id="status" role="status"></div>
  </form>

  <h2 data-t="web.notes.onThePanel">On the panel</h2>
  <ul id="notes"></ul>
</main>
<script src="/i18n.js"></script>
<script>
"use strict";
const papers = ["#ffe7a3", "#cfe6ff", "#d9f5de", "#ffd6e0", "#e8dcff"];
// Matches the panel's colour for each note, so the list here looks like the wall.
const stable = (s) => [...s].reduce((h, c) => (h * 31 + c.charCodeAt(0)) & 0x3fffffff, 7);
const $ = (id) => document.getElementById(id);

try { $("from").value = localStorage.getItem("notes.from") || ""; } catch {}

function ago(iso) {
  const d = (Date.now() - Date.parse(iso)) / 60000;
  if (d < 1) return t("web.notes.justNow", "just now");
  if (d < 60) return t("web.notes.minAgo", "{n} min ago", { n: Math.round(d) });
  // In the panel's language, not the browser's.
  if (d < 60 * 24) return new Date(iso).toLocaleTimeString(LANGUAGE, { hour: "2-digit", minute: "2-digit" });
  return new Date(iso).toLocaleDateString(LANGUAGE, { weekday: "short", day: "numeric", month: "short" });
}

function show(notes) {
  const list = $("notes");
  list.innerHTML = "";
  if (!notes.length) {
    const empty = document.createElement("li");
    empty.className = "empty";
    empty.style.cssText = "background:none;box-shadow:none;color:var(--muted);display:block";
    empty.textContent = t("web.notes.noNotes", "No notes on the panel.");
    list.appendChild(empty);
    return;
  }
  for (const n of notes) {
    const li = document.createElement("li");
    li.style.background = papers[stable(n.id) % papers.length];
    const text = document.createElement("div");
    text.className = "text";
    text.textContent = n.text;
    const meta = document.createElement("small");
    meta.textContent = [n.from, ago(n.at)].filter(Boolean).join(" · ");
    text.appendChild(meta);
    const del = document.createElement("button");
    del.type = "button";
    del.textContent = t("web.notes.takeDown", "Take down");
    del.onclick = async () => {
      del.disabled = true;
      await call("DELETE", "/api/notes?id=" + encodeURIComponent(n.id));
    };
    li.append(text, del);
    list.appendChild(li);
  }
}

async function call(method, path, body) {
  const status = $("status");
  try {
    const r = await fetch(path, {
      method,
      headers: body ? { "Content-Type": "application/json" } : {},
      body: body ? JSON.stringify(body) : undefined,
    });
    if (!r.ok) throw new Error("The panel answered " + r.status);
    const data = await r.json();
    show(data.notes || []);
    status.className = "";
    return true;
  } catch (e) {
    status.className = "error";
    status.textContent = t("web.common.unreachable", "Couldn’t reach the panel. Check you’re on the home Wi-Fi and try again.");
    return false;
  }
}

$("text").addEventListener("input", () => {
  $("left").textContent = String(280 - $("text").value.length);
});

$("form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const text = $("text").value.trim();
  if (!text) return;
  const from = $("from").value.trim();
  try { localStorage.setItem("notes.from", from); } catch {}
  $("post").disabled = true;
  if (await call("POST", "/api/notes", { text, from })) {
    $("text").value = "";
    $("left").textContent = "280";
    $("status").textContent = t("web.notes.posted", "Posted. It’s on the panel now.");
  }
  $("post").disabled = false;
});

// Words first, so the notes are drawn in the panel's language.
loadWords().then(() => call("GET", "/api/notes"));
setInterval(() => { if (!document.hidden) call("GET", "/api/notes"); }, 30000);
</script>
</body>
</html>
